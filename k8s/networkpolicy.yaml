apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: steuer-pruefdienst-zero-trust
  namespace: fachverfahren-steuer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: steuer-pruefdienst
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow application traffic on port 8080 from ingress gateway namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
      ports:
        - protocol: TCP
          port: 8080
    # Allow health and metrics scraping on management port 9990 from monitoring namespace only
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9990
  egress:
    # Allow DNS resolution inside cluster
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
