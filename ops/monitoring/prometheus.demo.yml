global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "wildfly-fachverfahren-steuer"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "steuer-pruefdienst:9990"
        labels:
          application: "steuer-pruefdienst"
          environment: "production-rechenzentrum"
