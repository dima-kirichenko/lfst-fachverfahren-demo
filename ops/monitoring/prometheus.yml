global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "wildfly-fachverfahren-steuer"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "steuer-pruefdienst.fachverfahren-steuer.svc.cluster.local:9990"
          - "127.0.0.1:9990"
        labels:
          application: "steuer-pruefdienst"
          environment: "production-rechenzentrum"

  - job_name: "linux-rechenzentrum-node"
    static_configs:
      - targets:
          - "127.0.0.1:9100"
        labels:
          role: "rechenzentrum-host"
